name: Generate snake animation

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite que você rode manualmente pela aba Actions
  workflow_dispatch:

  # Roda toda vez que você fizer um push para a branch 'main'
  push:
    branches:
      - main # Se sua branch principal for 'master', troque 'main' por 'master'

jobs:
  generate:
    permissions:
      contents: write # Permissão para o workflow escrever no repositório

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          # Adicionamos uma nova linha para a paleta azul personalizada
          # A primeira cor é o fundo (transparent), as outras são para os pontos.
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-ocean.svg?palette=ocean
            dist/snake-blue.svg?palette=transparent,CADBFF,82A7FF,5887FF,3374FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
